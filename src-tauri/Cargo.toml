[package]
name = "session-forge"
version = "0.2.1"
description = "Aggregate AI coding agent sessions into knowledge assets"
edition = "2021"

[lib]
name = "session_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "session-forge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
# Auto-update. The client refuses any bundle whose minisign signature does not
# verify against the pubkey pinned in tauri.conf.json, so a tampered or
# substituted asset cannot be installed. Signing happens in CI (see
# .github/workflows/release.yml); the private key never enters the repo.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
