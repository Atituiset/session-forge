[package]
name = "session-forge"
version = "0.3.0"
description = "Aggregate AI coding agent sessions into knowledge assets"
edition = "2021"

[lib]
name = "session_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "session-forge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
# Auto-update. The client refuses any bundle whose minisign signature does not
# verify against the pubkey pinned in tauri.conf.json, so a tampered or
# substituted asset cannot be installed. Signing happens in CI (see
# .github/workflows/release.yml); the private key never enters the repo.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# strip must stay off. Two independent reasons, both from the AppImage path:
#   - tauri patches the binary with a __TAURI_BUNDLE_TYPE marker after
#     building and warns "symbol stripping is disabled … Updater plugin may
#     not be able to update this package" when it cannot find it;
#   - linuxdeploy runs `strip` over the bundled AppDir and fails on
#     `.relr.dyn` sections in stripped shared objects
#     (upstream tauri-apps/tauri#15106).
# Cost is a larger binary; correctness of the updater is worth it.
strip = false
lto = true
codegen-units = 1
