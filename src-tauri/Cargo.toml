[package]
name = "session-forge"
version = "0.1.15"
description = "Aggregate AI coding agent sessions into knowledge assets"
edition = "2021"

[lib]
name = "session_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "session-forge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
