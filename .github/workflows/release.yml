name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sidecar:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: |
              bun-linux-x64 session-forge-engine-x86_64-unknown-linux-gnu
              bun-linux-arm64 session-forge-engine-aarch64-unknown-linux-gnu
          - os: macos-latest
            targets: |
              bun-darwin-arm64 session-forge-engine-aarch64-apple-darwin
              bun-darwin-x64 session-forge-engine-x86_64-apple-darwin
          - os: windows-latest
            targets: |
              bun-windows-x64 session-forge-engine-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - name: build engine sidecars
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          mkdir -p src-tauri/binaries
          echo "$TARGETS" | while read -r target outfile; do
            [ -z "$target" ] && continue
            echo "==> $target -> $outfile"
            bun build --compile --target="$target" src/cli.ts --outfile "src-tauri/binaries/$outfile"
          done
          # Linux scan agent (auto-deployed to WSL/ssh targets by the engine).
          if [ "$RUNNER_OS" = "Linux" ]; then
            bun build --compile --target=bun-linux-x64 src/cli.ts --outfile "src-tauri/binaries/session-forge-linux-x64-agent"
          fi
          ls -lh src-tauri/binaries/
      - uses: actions/upload-artifact@v4
        with:
          name: sidecars-${{ matrix.os }}
          path: src-tauri/binaries/
          retention-days: 1

  desktop:
    needs: sidecar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux pins 22.04 on purpose. Tauri's AppImage bundler is
        # linuxdeploy, which is itself an AppImage and needs FUSE; ubuntu-latest
        # (24.04 noble) runners cannot mount FUSE images under their CI
        # seccomp/namespace setup, and the failure is only ever reported as
        # "failed to run linuxdeploy". jammy still supports what the AppImage
        # path needs.
        #
        # (Earlier revision of this comment claimed APPIMAGE_EXTRACT_AND_RUN
        # does not propagate through Tauri's spawn chain, citing tauri#15106.
        # That is outdated: tauri-bundler 2.9.x sets APPIMAGE_EXTRACT_AND_RUN=1
        # and passes --appimage-extract-and-run to linuxdeploy itself.)
        #
        # sidecarOs is where the platform's engine binary is BUILT, which for
        # Linux is still ubuntu-latest. Keying the artifact download on `os`
        # made the job look for sidecars-ubuntu-22.04 — nothing publishes that
        # — and it died in "place sidecars" before reaching the bundler.
        include:
          - os: ubuntu-22.04
            sidecarOs: ubuntu-latest
          - os: macos-latest
            sidecarOs: macos-latest
          - os: windows-latest
            sidecarOs: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: sidecars-${{ matrix.sidecarOs }}
          path: sidecar-bundle
      - name: download linux scan agent (all platforms bundle it)
        uses: actions/download-artifact@v4
        with:
          name: sidecars-ubuntu-latest
          path: sidecar-linux
      - name: place sidecars
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp sidecar-bundle/* src-tauri/binaries/
          # The linux scan agent is what scans WSL guests and ssh remotes, so
          # every platform ships it regardless of its own engine target.
          cp sidecar-linux/session-forge-linux-x64-agent src-tauri/binaries/ 2>/dev/null || \
            echo "::warning::linux agent missing — auto-deploy disabled"
          chmod +x src-tauri/binaries/* || true
      - uses: dtolnay/rust-toolchain@stable
      - name: linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libfuse2 desktop-file-utils patchelf
      - name: fetch linuxdeploy (preflight)
        # linuxdeploy is itself an AppImage, and Tauri swallows its stderr —
        # reporting only "failed to run linuxdeploy", which cost three release
        # attempts to diagnose blind. Run it here first so a failure names its
        # real cause instead of surfacing as that opaque message later.
        # (A throwaway-AppDir bundle probe was tried and removed: it passes
        # even where the real build fails, so it diagnoses nothing. The
        # postmortem step below re-runs tauri's exact invocation instead.)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/linuxdeploy.AppImage \
            https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy.AppImage
          # shellcheck disable=SC2086
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/linuxdeploy.AppImage --verbosity=0 --version \
            || { echo "::error::linuxdeploy cannot execute on this runner"; exit 1; }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set for the bundling step too, not just the preflight: Tauri spawns
          # linuxdeploy directly, so the variable has to be in its environment.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # patchelf destroys `bun build --compile` binaries (their JS payload
          # is an offset-referenced overlay): after linuxdeploy's rpath pass
          # they SEGFAULT on start and `ldd` fails silently, which aborted the
          # gtk plugin's nested linuxdeploy run ("Failed to run ldd: exited
          # with code 1") — surfaced by tauri only as "failed to run
          # linuxdeploy". linuxdeploy honors $PATCHELF (elf_file.cpp): point
          # it at the selective wrapper that skips the bun sidecars (they
          # link only system libs and need no rpath) and passes everything
          # else through to the real patchelf.
          PATCHELF: ${{ github.workspace }}/scripts/linuxdeploy-patchelf.sh
          # linuxdeploy would also strip the sidecars; strip drops the bun
          # overlay the same way. Skip stripping for the whole bundle.
          NO_STRIP: "1"
          # Signing material for the updater. Without these, tauri-action
          # still uploads installers but emits no .sig / latest.json, so the
          # client has nothing to verify against its pinned pubkey and every
          # update check fails. The private key lives only in Actions secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SessionForge ${{ github.ref_name }}"
          releaseBody: "AI 编码 Session 聚合与互操作平台。桌面版内置引擎，数据全部本地处理。"
          releaseDraft: false
          prerelease: false
          # No `--bundles deb` override here. That override predates the
          # updater and silently broke it: on Linux the updater signs the
          # AppImage, so building only `deb` produced a release with no .sig
          # and no latest.json ("Signature not found for the updater JSON").
          # Build the platform default set and sign whatever updater
          # recognises. CI time goes up by one Linux bundle; correctness
          # wins.
          # --verbose: without it tauri-bundler discards linuxdeploy's
          # stdout/stderr entirely and reports only "failed to run
          # linuxdeploy" (appimage/linuxdeploy.rs). In verbose mode the
          # bundler logs every linuxdeploy stderr line, so the real error
          # reaches the CI log. Keep this until the AppImage build is stable.
          args: --verbose
      - name: linuxdeploy postmortem — re-run with visible stderr
        # Belt and braces for the --verbose flag above: the failed tauri build
        # leaves the AppDir under bundle/appimage/ and the downloaded tools in
        # ~/.cache/tauri, so repeat tauri's exact linuxdeploy invocation here
        # where nothing can swallow its output.
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          APPDIR=$(ls -d src-tauri/target/release/bundle/appimage/*.AppDir 2>/dev/null | head -1)
          [ -n "$APPDIR" ] || { echo "no AppDir survived the failed build"; exit 0; }
          export PATH="$HOME/.cache/tauri:$PATH"
          export PATCHELF="$GITHUB_WORKSPACE/scripts/linuxdeploy-patchelf.sh"
          export NO_STRIP=1
          OUTPUT=/tmp/postmortem.AppImage ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            "$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage" \
            --appimage-extract-and-run --verbosity 0 \
            --appdir "$APPDIR" --plugin gtk --output appimage
      - name: windows smoke — install / run / overwrite / uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/SessionForge_*_x64-setup.exe" | Select-Object -First 1

          function Get-InstallDir {
            $key = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\SessionForge" -ErrorAction SilentlyContinue
            if ($key -and $key.InstallLocation) { return $key.InstallLocation.Trim('"').TrimEnd('\') }
            foreach ($p in @("$env:LOCALAPPDATA\SessionForge", "$env:LOCALAPPDATA\Programs\SessionForge")) {
              if (Test-Path "$p\SessionForge.exe") { return $p }
            }
            throw "install location not found"
          }
          function Wait-Healthy {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep 1
              try {
                $h = Invoke-RestMethod "http://127.0.0.1:4177/api/health" -TimeoutSec 2
                if ($h.ok) { return }
              } catch {}
            }
            throw "engine health check failed after 30s"
          }

          Write-Host "== install #1 (silent) =="
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $dir = Get-InstallDir
          Write-Host "installed to: $dir"

          Write-Host "== launch app, expect engine sidecar on :4177 =="
          Write-Host (Get-ChildItem $dir | Select-Object -ExpandProperty Name | Out-String)
          $main = Get-ChildItem $dir -Filter "*.exe" |
            Where-Object { $_.Name -notlike "unins*" -and $_.Name -notlike "*engine*" } |
            Select-Object -First 1
          if (-not $main) { throw "no main executable found in $dir" }
          # Derive engine process name from the bundled engine binary, not hardcoded.
          $engineExe = Get-ChildItem $dir -Filter "*engine*.exe" | Select-Object -First 1
          if (-not $engineExe) { throw "no engine executable found in $dir" }
          $engineProcName = [IO.Path]::GetFileNameWithoutExtension($engineExe.Name)
          Start-Process $main.FullName
          Wait-Healthy
          if (-not (Get-Process $engineProcName -ErrorAction SilentlyContinue)) { throw "engine process not running" }
          Write-Host "engine healthy, sidecar process confirmed"

          Write-Host "== install #2 over RUNNING app (validates taskkill hooks) =="
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          Start-Sleep 3
          Write-Host "overwrite install succeeded while app was running"

          Write-Host "== relaunch fresh build =="
          Start-Process $main.FullName
          Wait-Healthy
          Write-Host "relaunch healthy"

          Write-Host "== upgrade path: pre-0.1.4 schema db must migrate, not crash =="
          Stop-Process -Name $engineProcName -Force -ErrorAction SilentlyContinue
          Stop-Process -Name $main.BaseName -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          $sfHome = "$env:USERPROFILE\.session-forge"
          New-Item -ItemType Directory -Force -Path $sfHome | Out-Null
          # Schema as v0.1.4 created it: no tags/token_source/has_error columns.
          $legacySql = "CREATE TABLE IF NOT EXISTS sessions (source TEXT NOT NULL, id TEXT NOT NULL, rev INTEGER NOT NULL DEFAULT 0, project_path TEXT, started_at TEXT, ended_at TEXT, model TEXT, tokens_in INTEGER NOT NULL DEFAULT 0, tokens_out INTEGER NOT NULL DEFAULT 0, cost REAL, rounds INTEGER NOT NULL DEFAULT 0, files_json TEXT NOT NULL DEFAULT '[]', additions INTEGER NOT NULL DEFAULT 0, deletions INTEGER NOT NULL DEFAULT 0, raw TEXT NOT NULL, scanned_at INTEGER NOT NULL DEFAULT 0, PRIMARY KEY (source, id)); INSERT OR REPLACE INTO sessions (source, id, rev, project_path, raw) VALUES ('claude-code', 'legacy-smoke-session', 1, 'C:/tmp', '{""id"":""legacy-smoke-session"",""source"":""claude-code"",""sourceVersion"":null,""projectPath"":null,""startedAt"":null,""endedAt"":null,""messages"":[],""rawMeta"":{}}');"
          Set-Content -Path "$env:TEMP\legacy-schema.sql" -Value $legacySql -Encoding utf8
          $seedTs = 'import { Database } from "bun:sqlite"; const db = new Database(process.argv[2], { create: true }); db.exec(require("fs").readFileSync(process.argv[3], "utf8")); db.close(); console.log("legacy db seeded");'
          Set-Content -Path "$env:TEMP\seed-legacy.ts" -Value $seedTs -Encoding utf8
          bun run "$env:TEMP\seed-legacy.ts" "$sfHome\cache.db" "$env:TEMP\legacy-schema.sql"
          if (-not (Test-Path "$sfHome\cache.db")) { throw "legacy db seeding failed" }

          Start-Process $main.FullName
          Wait-Healthy
          $data = Invoke-RestMethod "http://127.0.0.1:4177/api/data" -TimeoutSec 10
          if ($data.totals.sessions -lt 1) { throw "legacy session not visible after migration" }
          Write-Host "upgrade-path PASSED (legacy db migrated, engine healthy)"

          Write-Host "== uninstall (validates PREUNINSTALL taskkill hook) =="
          $unins = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          Start-Process $unins.FullName -ArgumentList "/S" -Wait
          Start-Sleep 5
          $survivorNames = @($engineProcName, $main.BaseName)
          if (Get-Process -Name $survivorNames -ErrorAction SilentlyContinue) {
            Get-Process -Name $survivorNames -ErrorAction SilentlyContinue | Stop-Process -Force
            throw "processes survived uninstall"
          }
          if (Test-Path "$dir\$($main.Name)") { throw "binary survived uninstall" }
          if (Get-ChildItem $dir -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object Name -notlike "unins*") { throw "main binary survived uninstall" }
          Write-Host "windows smoke PASSED"

  cli:
    needs: sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile
      - run: bash scripts/build-all.sh
      - name: package cli binaries
        run: |
          cd dist
          for f in session-forge-linux-* session-forge-macos-*; do
            tar czf "$f.tar.gz" "$f"; rm "$f"
          done
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
