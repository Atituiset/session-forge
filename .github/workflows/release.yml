name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sidecar:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: |
              bun-linux-x64 session-forge-engine-x86_64-unknown-linux-gnu
              bun-linux-arm64 session-forge-engine-aarch64-unknown-linux-gnu
          - os: macos-latest
            targets: |
              bun-darwin-arm64 session-forge-engine-aarch64-apple-darwin
              bun-darwin-x64 session-forge-engine-x86_64-apple-darwin
          - os: windows-latest
            targets: |
              bun-windows-x64 session-forge-engine-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - name: build engine sidecars
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          mkdir -p src-tauri/binaries
          echo "$TARGETS" | while read -r target outfile; do
            [ -z "$target" ] && continue
            echo "==> $target -> $outfile"
            bun build --compile --target="$target" src/cli.ts --outfile "src-tauri/binaries/$outfile"
          done
          ls -lh src-tauri/binaries/
      - uses: actions/upload-artifact@v4
        with:
          name: sidecars-${{ matrix.os }}
          path: src-tauri/binaries/
          retention-days: 1

  desktop:
    needs: sidecar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: sidecars-${{ matrix.os }}
          path: .
      - name: place sidecars
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp sidecars-${{ matrix.os }}/* src-tauri/binaries/
          chmod +x src-tauri/binaries/* || true
      - uses: dtolnay/rust-toolchain@stable
      - name: linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SessionForge ${{ github.ref_name }}"
          releaseBody: "AI 编码 Session 聚合与互操作平台。桌面版内置引擎，数据全部本地处理。"
          releaseDraft: false
          prerelease: false
          args: ${{ runner.os == 'Linux' && '--bundles deb' || '' }}
      - name: windows smoke — install / run / overwrite / uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/SessionForge_*_x64-setup.exe" | Select-Object -First 1

          function Get-InstallDir {
            $key = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\SessionForge" -ErrorAction SilentlyContinue
            if ($key -and $key.InstallLocation) { return $key.InstallLocation.Trim('"').TrimEnd('\') }
            foreach ($p in @("$env:LOCALAPPDATA\SessionForge", "$env:LOCALAPPDATA\Programs\SessionForge")) {
              if (Test-Path "$p\SessionForge.exe") { return $p }
            }
            throw "install location not found"
          }
          function Wait-Healthy {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep 1
              try {
                $h = Invoke-RestMethod "http://127.0.0.1:4177/api/health" -TimeoutSec 2
                if ($h.ok) { return }
              } catch {}
            }
            throw "engine health check failed after 30s"
          }

          Write-Host "== install #1 (silent) =="
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $dir = Get-InstallDir
          Write-Host "installed to: $dir"

          Write-Host "== launch app, expect engine sidecar on :4177 =="
          Write-Host (Get-ChildItem $dir | Select-Object -ExpandProperty Name | Out-String)
          $main = Get-ChildItem $dir -Filter "*.exe" |
            Where-Object { $_.Name -notlike "unins*" -and $_.Name -notlike "*engine*" } |
            Select-Object -First 1
          if (-not $main) { throw "no main executable found in $dir" }
          # Derive engine process name from the bundled engine binary, not hardcoded.
          $engineExe = Get-ChildItem $dir -Filter "*engine*.exe" | Select-Object -First 1
          if (-not $engineExe) { throw "no engine executable found in $dir" }
          $engineProcName = [IO.Path]::GetFileNameWithoutExtension($engineExe.Name)
          Start-Process $main.FullName
          Wait-Healthy
          if (-not (Get-Process $engineProcName -ErrorAction SilentlyContinue)) { throw "engine process not running" }
          Write-Host "engine healthy, sidecar process confirmed"

          Write-Host "== install #2 over RUNNING app (validates taskkill hooks) =="
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          Start-Sleep 3
          Write-Host "overwrite install succeeded while app was running"

          Write-Host "== relaunch fresh build =="
          Start-Process $main.FullName
          Wait-Healthy
          Write-Host "relaunch healthy"

          Write-Host "== upgrade path: pre-0.1.4 schema db must migrate, not crash =="
          Stop-Process -Name $engineProcName -Force -ErrorAction SilentlyContinue
          Stop-Process -Name $main.BaseName -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          $sfHome = "$env:USERPROFILE\.session-forge"
          New-Item -ItemType Directory -Force -Path $sfHome | Out-Null
          # Schema as v0.1.4 created it: no tags/token_source/has_error columns.
          $legacySql = "CREATE TABLE IF NOT EXISTS sessions (source TEXT NOT NULL, id TEXT NOT NULL, rev INTEGER NOT NULL DEFAULT 0, project_path TEXT, started_at TEXT, ended_at TEXT, model TEXT, tokens_in INTEGER NOT NULL DEFAULT 0, tokens_out INTEGER NOT NULL DEFAULT 0, cost REAL, rounds INTEGER NOT NULL DEFAULT 0, files_json TEXT NOT NULL DEFAULT '[]', additions INTEGER NOT NULL DEFAULT 0, deletions INTEGER NOT NULL DEFAULT 0, raw TEXT NOT NULL, scanned_at INTEGER NOT NULL DEFAULT 0, PRIMARY KEY (source, id)); INSERT OR REPLACE INTO sessions (source, id, rev, project_path, raw) VALUES ('claude-code', 'legacy-smoke-session', 1, 'C:/tmp', '{""id"":""legacy-smoke-session"",""source"":""claude-code"",""sourceVersion"":null,""projectPath"":null,""startedAt"":null,""endedAt"":null,""messages"":[],""rawMeta"":{}}');"
          Set-Content -Path "$env:TEMP\legacy-schema.sql" -Value $legacySql -Encoding utf8
          $seedTs = 'import { Database } from "bun:sqlite"; const db = new Database(process.argv[2], { create: true }); db.exec(require("fs").readFileSync(process.argv[3], "utf8")); db.close(); console.log("legacy db seeded");'
          Set-Content -Path "$env:TEMP\seed-legacy.ts" -Value $seedTs -Encoding utf8
          bun run "$env:TEMP\seed-legacy.ts" "$sfHome\cache.db" "$env:TEMP\legacy-schema.sql"
          if (-not (Test-Path "$sfHome\cache.db")) { throw "legacy db seeding failed" }

          Start-Process $main.FullName
          Wait-Healthy
          $data = Invoke-RestMethod "http://127.0.0.1:4177/api/data" -TimeoutSec 10
          if ($data.totals.sessions -lt 1) { throw "legacy session not visible after migration" }
          Write-Host "upgrade-path PASSED (legacy db migrated, engine healthy)"

          Write-Host "== uninstall (validates PREUNINSTALL taskkill hook) =="
          $unins = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          Start-Process $unins.FullName -ArgumentList "/S" -Wait
          Start-Sleep 5
          $survivorNames = @($engineProcName, $main.BaseName)
          if (Get-Process -Name $survivorNames -ErrorAction SilentlyContinue) {
            Get-Process -Name $survivorNames -ErrorAction SilentlyContinue | Stop-Process -Force
            throw "processes survived uninstall"
          }
          if (Test-Path "$dir\$($main.Name)") { throw "binary survived uninstall" }
          if (Get-ChildItem $dir -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object Name -notlike "unins*") { throw "main binary survived uninstall" }
          Write-Host "windows smoke PASSED"

  cli:
    needs: sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile
      - run: bash scripts/build-all.sh
      - name: package cli binaries
        run: |
          cd dist
          for f in session-forge-linux-* session-forge-macos-*; do
            tar czf "$f.tar.gz" "$f"; rm "$f"
          done
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
